# Exact-match APK so the /products/days/ SPA try_files never
# serves index.html as a fake installer. `location =` wins over
# `location ^~ /products/days/`. Include this before that SPA block:
#   include /etc/nginx/snippets/kemiao-days-apk.conf;
location = /products/days/kemiao-days.apk {
    root /var/www/yyds-course-platform/public;
    types { }
    default_type application/vnd.android.package-archive;
    gzip off;
    sendfile on;
    tcp_nopush on;
    add_header Content-Disposition 'attachment; filename="kemiao-days.apk"';
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    access_log /var/log/nginx/kemiao-days-apk.log kemiao_apk;
}

# Versioned names are exact matches so `location ^~ /products/days/`
# cannot turn a missing file into index.html. Deploy appends one
# `location =` per published file; never overwrite a different hash.
location = /products/days/kemiao-days-2.4.0.apk {
    root /var/www/yyds-course-platform/public;
    types { }
    default_type application/vnd.android.package-archive;
    gzip off;
    sendfile on;
    tcp_nopush on;
    add_header Content-Disposition 'attachment; filename="kemiao-days-2.4.0.apk"';
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log /var/log/nginx/kemiao-days-apk.log kemiao_apk;
}

