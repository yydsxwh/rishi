    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 1m;
    proxy_read_timeout 30s;
}

location = /api/days/account/resolve {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 1m;
}

location = /api/days/contacts/kkchat {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
}

location ^~ /api/days/geo/ {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 30s;
}

location ^~ /api/days/devices {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 1m;
    proxy_read_timeout 30s;
}

# 日事站长后台：Account / Platform / 产品 API。前缀只盖 /api/days/admin，
# 不要写成 ^~ /api/days/，以免抢走 Next 其它同前缀路由。
location ^~ /api/days/admin {
    proxy_pass http://127.0.0.1:3120;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
