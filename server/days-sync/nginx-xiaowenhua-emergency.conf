# 香港 xiaowenhua.net 临时应急入口。只挂在 xiaowenhua.net 的 HTTPS server 里。
# 不改站点根路径，不把日事 BFF 并进 xiaowenhua 的 Node 进程。
# /kemiao-days-api/ 去掉前缀后转发到本机 kemiao-days-sync（127.0.0.1:3120）。

location ^~ /kemiao-days-api/ {
    proxy_pass http://127.0.0.1:3120/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 20m;
    proxy_read_timeout 120s;
}

location ^~ /downloads/rishi/ {
    alias /var/www/downloads/rishi/;
    autoindex off;
    gzip off;
    sendfile on;
    tcp_nopush on;
    types {
        application/vnd.android.package-archive apk;
        application/json json;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
}
